[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ATENÇÃO — badge "Powered by Netlify" (canto inferior direito)
# Não existe chave de netlify.toml, variável de ambiente ou header que desative o
# badge nem a Netlify Drawer: as duas opções são só de painel.
#   Badge:  Project configuration > General > Powered by Netlify badge > desligar
#           (vale na requisição seguinte, sem precisar de novo deploy)
#   Drawer: Project configuration > Build & deploy > Continuous deployment >
#           Collaboration tools > Configure > desativar a Netlify Drawer
# O badge só aparece em projetos do plano Free; em planos pagos já vem desligado.

# Bundles do Vite têm hash no nome: cache longo é seguro.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens em /img/ NÃO têm hash no nome e podem ser substituídas mantendo o
# mesmo arquivo. Cache curto com revalidação (ETag): a troca aparece no
# próximo acesso, e o navegador ainda reaproveita o que não mudou.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
